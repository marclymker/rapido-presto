<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Crédit mariage Rapido Presto</title>
  <desc id="desc">Fond élégant champagne et terracotta pour l’offre de crédit mariage.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#351b2d"/><stop offset=".55" stop-color="#914f4a"/><stop offset="1" stop-color="#e3a86d"/></linearGradient><radialGradient id="glow"><stop stop-color="#fff1c8" stop-opacity=".8"/><stop offset="1" stop-color="#fff1c8" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="940" cy="125" r="240" fill="url(#glow)" opacity=".55"/><circle cx="1070" cy="490" r="210" fill="#1f1221" opacity=".18"/>
  <g fill="none" stroke="#f8e5bd" stroke-width="5" opacity=".8"><circle cx="950" cy="220" r="95"/><circle cx="950" cy="220" r="62"/></g>
  <text x="78" y="128" fill="#f7d98d" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="6">RAPIDO PRESTO</text>
  <text x="78" y="265" fill="#fff" font-family="Georgia,serif" font-size="64" font-weight="700">Peye maryaj ou</text><text x="78" y="340" fill="#f7d98d" font-family="Georgia,serif" font-size="64" font-weight="700">kredi depi kounya</text>
  <text x="80" y="430" fill="#fff" font-family="Arial,sans-serif" font-size="28">1000 Gourdes sèlman pou rezève.</text>
</svg>
