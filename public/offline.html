<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne - Kairos</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: white; border-radius: 12px; padding: 32px 24px; text-align: center; max-width: 320px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #050505; font-size: 18px; margin: 0 0 8px; }
    p { color: #65676b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #1877F2; color: white; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Pas de connexion</h1>
    <p>Vous êtes hors ligne. Les produits que vous avez consultés restent accessibles.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
